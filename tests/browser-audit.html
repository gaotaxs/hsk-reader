<!doctype html><meta charset="utf-8"><title>Reader 1.18 audit QA</title><style>body{margin:0;background:#777;font:14px system-ui;color:white}aside{position:fixed;left:1220px;top:12px;max-width:390px}button{padding:8px;margin:3px}iframe{border:0;width:402px;height:874px}pre{white-space:pre-wrap}</style><iframe src="./app/"></iframe><aside><button id="portrait">402×874</button><button id="landscape">874×402</button><button id="tablet">834×1194</button><button id="tabletLandscape">1194×834</button><button id="history">History checks</button><button id="history-preview">History preview</button><button id="quizzes">Quiz layout checks</button><button id="matrix">Run all panels/themes</button><button id="long">Long sentence</button><button id="corpus">All sentences</button><pre id="report">Isolated synthetic storage. Chromium viewport simulation.</pre></aside><script>const frame=document.querySelector('iframe');for(const id of ['portrait','landscape','tablet','tabletLandscape'])document.getElementById(id).onclick=()=>{const sizes={portrait:[402,874],landscape:[874,402],tablet:[834,1194],tabletLandscape:[1194,834]},[w,h]=sizes[id];frame.style.width=w+'px';frame.style.height=h+'px';};for(const id of ['matrix','long','corpus','quizzes','history','history-preview'])document.getElementById(id).onclick=()=>{document.getElementById('report').dataset.state='running';frame.contentWindow.postMessage({qa:id},location.origin);};window.addEventListener('message',e=>{if(e.data.report){document.getElementById('report').textContent=e.data.report;document.getElementById('report').dataset.state='done';}});</script>
